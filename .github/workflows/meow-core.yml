name: build-meow-core

# 用 meow-rs(Rust) 构建 libclash.so，替换 Go 内核。
#
# 两个作业：
#   1) check-native —— 主机原生编译，秒级暴露 Rust 编译错误（不依赖 NDK）
#   2) build-android —— 用 GH runner 预装 NDK + cargo-ndk 产出各 ABI 的 .so

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/meow-rs-core"
    paths:
      - "core/meow-ffi/**"
      - "core/meow-rs/**"
      - ".github/workflows/meow-core.yml"

jobs:
  check-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps (BoringSSL 需要 cmake + C++)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 meow-rs 工作区 + BoringSSL 编译产物（最关键，最高能省掉大半构建时间）
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core/meow-ffi core/meow-rs"
      - name: Native build (rapid Rust compile-error gate)
        run: |
          set -e
          cd core/meow-ffi
          cargo build -p meow-flclash-ffi

  build-android:
    runs-on: ubuntu-latest
    needs: check-native
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 缓存 cargo 产物（含 BoringSSL），跨 ABI/运行复用
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core/meow-ffi core/meow-rs"
      - name: Locate NDK (preinstalled on GH runner)
        id: ndk
        run: |
          choose() { for c in "$ANDROID_NDK_LATEST_HOME" "$ANDROID_HOME/ndk-bundle" "$ANDROID_HOME"/ndk/*/; do [ -n "$c" ] && [ -d "$c" ] && { echo "$c"; return 0; }; done; return 1; }
          NDK="$(choose)" || { echo "no NDK found"; exit 1; }
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build libclash.so
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
        run: |
          set -e
          cd core/meow-ffi
          cargo ndk --target ${{ matrix.target }} --platform 21 \
            -- build --release -p meow-flclash-ffi
      - name: Stage artifact
        run: |
          mkdir -p libclash/android/${{ matrix.abi }}
          cp core/meow-ffi/target/${{ matrix.target }}/release/libclash.so \
             libclash/android/${{ matrix.abi }}/libclash.so
          cp core/meow-ffi/include/libclash.h libclash/android/
      - uses: actions/upload-artifact@v4
        with:
          name: meow-clash-${{ matrix.abi }}
          path: libclash/android/