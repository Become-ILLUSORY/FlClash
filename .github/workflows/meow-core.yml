name: build-meow-core

# 用 meow-rs(Rust) 构建 libclash.so，替换 Go 内核。
# 产物：libclash/android/<abi>/ 下的 .so，供 FlClash 打包。

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/meow-rs-core"
    paths:
      - "core/meow-ffi/**"
      - "core/meow-rs/**"
      - ".github/workflows/meow-core.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system deps (BoringSSL/quiche 需要 cmake + C++)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android NDK
        uses: android-actions/setup-android@v3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build libclash.so
        env:
          NDK_HOME: $ANDROID_HOME/ndk-bundle
        run: |
          set -e
          NDK=$(ls -d "$ANDROID_HOME/ndk/"*/ | head -1)
          export ANDROID_NDK="$NDK"
          cargo ndk --manifest-path core/meow-ffi/Cargo.toml \
            --target ${{ matrix.target }} --platform 21 \
            -- build --release -p meow-flclash-ffi
      - name: Stage artifact
        run: |
          mkdir -p libclash/android/${{ matrix.abi }}
          cp core/meow-ffi/target/${{ matrix.target }}/release/libclash.so \
             libclash/android/${{ matrix.abi }}/libclash.so
          cp core/meow-ffi/include/libclash.h libclash/android/
      - uses: actions/upload-artifact@v4
        with:
          name: meow-clash-${{ matrix.abi }}
          path: libclash/android/